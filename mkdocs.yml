      - 5 · Session report:
          - guides/session-report/index.md
          - Review the session in XtreeE Supervise: guides/session-report/review-the-session-in-xtreee-supervise.md
          - Analyse a printed object — 3D, 2D, material: guides/session-report/analyse-a-printed-object-3d-2d-material.md
          - Generate a production report: guides/session-report/generate-a-production-report.md
          - Record a failed or aborted session: guides/session-report/record-a-failed-or-aborted-session.md
