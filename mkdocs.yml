site_name: XtreeE Documentation
site_description: Robotic concrete 3D printing — guides, wiki and product reference.
site_url: https://xtreee-felipe.github.io/XtreeE_Docs/
repo_url: https://github.com/XtreeE-Felipe/XtreeE_Docs
repo_name: XtreeE-Felipe/XtreeE_Docs
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: "assets/ICON SVG.svg"
  favicon: "assets/ICON SVG.svg"
  icon:
    logo: "ICON SVG"
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - navigation.path
    - toc.follow
    - content.tabs.link
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: white
      accent: custom
      toggle:
        icon: material/toggle-switch-off-outline
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/toggle-switch
        name: Switch to light mode

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  # "Last updated" on every page, from git history (CI checks out full history).
  - git-revision-date-localized:
      type: date
      fallback_to_build_date: true
  # The real migration needs these; the prototype has no images and no old URLs.
  # - redirects:
  #     redirect_maps: {}
  # - glightbox

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - tables
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
      options:
        custom_icons:
          - docs/assets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.snippets:
      base_path:
        - docs/snippets
      check_paths: true
  - toc:
      permalink: true

# The snippets folder is an include source, not a set of pages.
exclude_docs: |
  snippets/

# Fail --strict on any page under docs/ that is missing from the nav.
validation:
  nav:
    omitted_files: warn

# Nav is explicit and always will be. The order is the argument, and it should be
# reviewable in a diff — never inferred alphabetically or by awesome-pages.
nav:
  - Home: index.md
  - Getting started:
      - cell-installation/index.md
      - Software:
          - Install and connect XtreeE Control: cell-installation/software/install-and-connect-xtreee-control.md
      - Printing Cell:
          - Register your equipment in Settings: cell-installation/printing-cell/register-your-equipment-in-settings.md
  - Operation guide:
      - guides/index.md
      - 1 · Toolpath design:
          - guides/toolpath-design/index.md
      - 2 · Program preparation:
          - guides/program-preparation/index.md
      - 3 · Session start-up:
          - guides/session-startup/index.md
          - Verify the Settings table against the cell: guides/session-startup/verify-the-settings-table-against-the-cell.md
          - Log the batch and spreading diameter: guides/session-startup/log-the-batch-and-spreading-diameter.md
      - 4 · Printing operation:
          - guides/printing-operation/index.md
          - Start a print — the initialization phase: guides/printing-operation/start-a-print-the-initialization-phase.md
          - Read the printing screen — what to watch: guides/printing-operation/read-the-printing-screen-what-to-watch.md
          - Adjust material flow: guides/printing-operation/adjust-material-flow.md
          - Adjust layer width: guides/printing-operation/adjust-layer-width.md
          - Adjust global performance: guides/printing-operation/adjust-global-performance.md
          - Pause and resume a print: guides/printing-operation/pause-and-resume-a-print.md
      - 5 · Session report:
          - guides/session-report/index.md
  # Maintenance & recovery, promoted to the top level. Its files stay under
  # guides/maintenance/ so no URL changes.
  - Troubleshooting:
      - guides/maintenance/index.md
      - Motors won't power on: guides/maintenance/motors-wont-power-on.md
      - Real flow doesn't match assigned flow: guides/maintenance/real-flow-doesnt-match-assigned-flow.md
      - A motor reports an error code: guides/maintenance/a-motor-reports-an-error-code.md
  - Wiki:
      - wiki/index.md
      - Glossary:
          - Session: wiki/glossary/session.md
  - Products:
      - products/index.md
      - XtreeE Control:
          - products/control/index.md
          - Control screen: products/control/control-screen.md
          - Printing control: products/control/printing-control.md
          - Settings: products/control/settings.md
          - Ink: products/control/ink.md
          - Data: products/control/data.md
  - Download: download.md
  - Known issues: known-issues.md
